<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Центральный мозг/ядро -->
  <circle cx="60" cy="60" r="25" fill="url(#brainGrad)" filter="url(#glow)"/>
  <path d="M48 55 Q60 42 72 55 Q78 63 72 73 Q60 82 48 73 Q42 63 48 55" fill="#fff" opacity="0.25"/>
  
  <!-- 6 орбитальных агентов -->
  <circle cx="60" cy="18" r="12" fill="#4ECDC4"/>
  <circle cx="96" cy="39" r="12" fill="#FF6B6B"/>
  <circle cx="96" cy="81" r="12" fill="#FFE66D"/>
  <circle cx="60" cy="102" r="12" fill="#95E1D3"/>
  <circle cx="24" cy="81" r="12" fill="#DDA0DD"/>
  <circle cx="24" cy="39" r="12" fill="#87CEEB"/>
  
  <!-- Соединительные линии -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="2">
    <line x1="60" y1="35" x2="60" y2="28"/>
    <line x1="78" y1="45" x2="86" y2="41"/>
    <line x1="78" y1="75" x2="86" y2="79"/>
    <line x1="60" y1="85" x2="60" y2="92"/>
    <line x1="42" y1="75" x2="34" y2="79"/>
    <line x1="42" y1="45" x2="34" y2="41"/>
  </g>
  
  <!-- Иконки на агентах -->
  <text x="60" y="22" text-anchor="middle" font-size="10">📊</text>
  <text x="96" y="43" text-anchor="middle" font-size="10">💰</text>
  <text x="96" y="85" text-anchor="middle" font-size="10">👥</text>
  <text x="60" y="106" text-anchor="middle" font-size="10">⭐</text>
  <text x="24" y="85" text-anchor="middle" font-size="10">🎯</text>
  <text x="24" y="43" text-anchor="middle" font-size="10">📈</text>
  
  <!-- AI в центре -->
  <text x="60" y="65" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="Arial, sans-serif">AI</text>
</svg>
